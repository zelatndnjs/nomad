<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kokoa Challenge</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script
      src="https://kit.fontawesome.com/b5ac015c11.js"
      crossorigin="anonymous"
    ></script>
    <div class="container">
      <div class="card left-screen">
        <div class="top-bar">
          <i class="fas fa-arrow-left"></i>
          <i class="fas fa-search"></i>
        </div>
        <div class="profile">
          <img src="profile.jpg" alt="Profile" />
          <h2>Tyler, The Creator</h2>
          <p>Rap, Hip-Hop</p>
        </div>
        <div class="buttons">
          <button class="shuffle">Shuffle</button>
          <div class="like"><i class="fas fa-heart"></i> 212,971</div>
        </div>
        <div class="track-list">
          <div class="track-item">
            <img src="cover1.jpg" alt="" />
            <div class="track-info">
              <strong>EARFQUAKE</strong>
              <span>Tyler, the Creator</span>
            </div>
            <i class="fas fa-ellipsis-v"></i>
          </div>
          <div class="track-item active">
            <img src="cover2.jpeg" alt="" />
            <div class="track-info">
              <strong>NOVEMBER</strong>
              <span>Tyler, the Creator</span>
            </div>
            <i class="fas fa-ellipsis-v"></i>
          </div>
          <div class="track-item">
            <img src="cover2.jpeg" alt="" />
            <div class="track-info">
              <strong>911</strong>
              <span>Tyler, the Creator</span>
            </div>
            <i class="fas fa-ellipsis-v"></i>
          </div>
          <div class="track-item">
            <img src="cover4.jpeg" alt="" />
            <div class="track-info">
              <strong>WOLF</strong>
              <span>Tyler, the Creator</span>
            </div>
            <i class="fas fa-ellipsis-v"></i>
          </div>
        </div>
        <div class="now-playing">
          <span>Tyler, The Creator</span>
          <div class="controls">
            <span>NOVEMBER</span>
            <div class="icons">
              <i class="fas fa-backward"></i>
              <i class="fas fa-pause"></i>
              <i class="fas fa-forward"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="card right-screen">
        <div class="top-bar">
          <i class="fas fa-arrow-left"></i>
          <i class="fas fa-ellipsis-v"></i>
        </div>
        <div class="cover-wrapper">
          <img src="cover2.jpeg" alt="Cover" />
        </div>
        <div class="track-title">
          <h2>November</h2>
          <p>Tyler, The Creator</p>
        </div>
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
        <div class="time">
          <span>1:56</span>
          <span>2:21</span>
        </div>
        <div class="play-buttons">
          <i class="fas fa-redo-alt"></i>
          <i class="fas fa-backward"></i>
          <i class="fas fa-play play"></i>
          <i class="fas fa-forward"></i>
          <i class="fas fa-random"></i>
        </div>
      </div>
    </div>
  </body>
</html>
